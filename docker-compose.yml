name: ${COMPOSE_PROJECT_NAME}
services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webcity -d webcity"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      HTTP_PORT: "${HTTP_PORT}"
      DATABASE_DSN: "${DATABASE_DSN}"
    depends_on:
      postgis:
        condition: service_healthy
    ports:
      - "8080:8080"

  updater:
    profiles: ["tools"]
    build:
      context: ./updater
      dockerfile: Dockerfile
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: "${DB_PORT}"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      OSM_PBF_URL: ${OSM_PBF_URL}
      OSM_PBF_FILE: ${OSM_PBF_FILE}
      OSM_PBF_MD5_URL: ${OSM_PBF_MD5_URL}
      OSM_EXTRACT_FILE: ${OSM_EXTRACT_FILE}
      OSM_EXTRACT_BBOX: ${OSM_EXTRACT_BBOX}
      OSM_EXTRACT_STRATEGY: ${OSM_EXTRACT_STRATEGY}
      OSM_MIN_BYTES: "${OSM_MIN_BYTES}"
      OSM_PREFIX: ${OSM_PREFIX}
      OSM_FORCE_DOWNLOAD: "${OSM_FORCE_DOWNLOAD}"
      OSM_CONFIG_FILE: /app/config/osm_rules.json
      DATAMOS_API_KEY: ${DATAMOS_API_KEY}
      DATAMOS_BASE_URL: https://apidata.mos.ru/v1
      DATAMOS_DATASET_ID: all
      DATAMOS_CONFIG_FILE: /app/config/datamos_datasets.json
    volumes:
      - osmdata:/data
    depends_on:
      postgis:
        condition: service_healthy

  frontend:
    image: nginx:1.27-alpine
    depends_on:
      - api
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./data:/usr/share/nginx/data:ro
    ports:
      - "8090:80"

volumes:
  pgdata:
  osmdata:
