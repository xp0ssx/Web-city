server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types image/svg+xml application/json text/css application/javascript;

  location ~ ^/tiles/base/([0-9]+)/([0-9]+)/([0-9]+)\.svg$ {
    root /usr/share/nginx/tilecache;
    try_files /base/$1/$2/$3.svg /__tile_fallback/$1/$2/$3;
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
  }

  location ~ ^/__tile_fallback/([0-9]+)/([0-9]+)/([0-9]+)$ {
    internal;
    rewrite ^/__tile_fallback/([0-9]+)/([0-9]+)/([0-9]+)$ /api/v1/tiles/base/$1/$2/$3 break;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }

  location /api/v1/ {
    proxy_pass http://api:8080/api/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
